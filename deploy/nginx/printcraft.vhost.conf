# Nginx vhost for a single-domain setup.
# Local example domain: dev.printcraft.com
# NOTE: /etc/hosts works for browser access only on your machine.
# Stripe webhooks from Dashboard require this domain to be publicly reachable.

server {
    listen 80;
    server_name dev.printcraft.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dev.printcraft.com;

    ssl_certificate /etc/letsencrypt/live/dev.printcraft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.printcraft.com/privkey.pem;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
