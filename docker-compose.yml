services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - printcraft_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printcraft -d printcraft"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  printcraft-api:
    build:
      context: .
      dockerfile: PrintCraftApi/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      FrontendBaseUrl: ${FrontendBaseUrl:?FrontendBaseUrl is required}
      BackendBaseUrl: ${BackendBaseUrl:?BackendBaseUrl is required}
      JwtSecret: ${JwtSecret}
      JwtIssuer: ${JwtIssuer}
      JwtAudience: ${JwtAudience}
      Discord__ErrorWebhookUrl: ${Discord__ErrorWebhookUrl}
      Discord__QuoteWebhookUrl: ${Discord__QuoteWebhookUrl}
      Discord__BookingWebhookUrl: ${Discord__BookingWebhookUrl}
      Discord__PaymentReceivedWebhookUrl: ${Discord__PaymentReceivedWebhookUrl}
      MollieKey: ${MollieKey:?MollieKey is required}
      CurrencyCode: ${CurrencyCode:-EUR}
      Email__SenderName: ${Email__SenderName}
      Email__SenderEmail: ${Email__SenderEmail}
      Email__SmtpHost: ${Email__SmtpHost}
      Email__SmtpPort: ${Email__SmtpPort}
      Email__EnableSsl: ${Email__EnableSsl}
      Email__ApiBaseUrl: ${Email__ApiBaseUrl}
      Email__Category: ${Email__Category}
      Email__ApiToken: ${Email__ApiToken}
      Email__Username: ${Email__Username}
      Email__Password: ${Email__Password}
    ports:
      - "5001:8080"
    volumes:
      - printcraft_uploads:/app/wwwroot/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CURRENCY_CODE: ${VITE_CURRENCY_CODE:-EUR}
    depends_on:
      - printcraft-api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  printcraft_postgres_data:
  printcraft_uploads:
