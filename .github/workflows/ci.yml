# CI/CD Pipeline for 3D Shop
# This workflow automates testing and deployment to production.
# - Runs on push to main branch
# - Tests backend and builds frontend
# - Builds Docker images and saves as artifacts
# - Deploys to server via SSH if tests pass

name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  # Job 1: Run tests (Stays entirely on GitHub's cloud)
  test:
    name: Test Code
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend: Setup .NET environment
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Backend: Restore dependencies
      - name: Restore backend dependencies
        run: dotnet restore PrintCraftApi/PrintCraftApi.csproj

      # Backend: Build the project
      - name: Build backend
        run: dotnet build PrintCraftApi/PrintCraftApi.csproj --no-restore --configuration Release

      # Backend: Run unit tests
      - name: Run backend tests
        run: dotnet test PrintCraftApi.Tests/PrintCraftApi.Tests.csproj --no-build --verbosity normal --configuration Release

      # (Optional) You can add Frontend tests here if you have them!

  # Job 2: Deploy (Only triggers if tests pass)
  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Go to the project folder on the Pi
            cd ~/projects/3d-shop

            # 2. Pull the latest code directly from GitHub
            git pull origin main

            # 3. Tell the Pi to build the new ARM64 images and start them
            # The --build flag forces Docker to rebuild if the code changed
            docker-compose up -d --build

            # 4. Clean up old, unused Docker images to save SD/SSD space
            docker image prune -f
