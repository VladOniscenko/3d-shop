# CI/CD Pipeline for 3D Shop
# This workflow automates testing and deployment to production.
# - Runs on push to main branch
# - Tests backend and builds frontend
# - Builds Docker images and saves as artifacts
# - Deploys to server via SSH if tests pass

name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  # Job 1: Run tests (Stays entirely on GitHub's cloud)
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend: Setup .NET environment
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Backend: Restore, Build, and Test
      - name: Restore backend dependencies
        run: dotnet restore PrintCraftApi/PrintCraftApi.csproj

      - name: Build backend
        run: dotnet build PrintCraftApi/PrintCraftApi.csproj --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test PrintCraftApi.Tests/PrintCraftApi.Tests.csproj --no-build --verbosity normal --configuration Release

      # Frontend: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Frontend: Install dependencies and Build
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  # Job 2: Deploy to Raspberry Pi (Only triggers if 'test' job succeeds)
  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # Step 1: Connect GitHub Runner to your Tailscale VPN
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # Step 2: SSH into the Pi over Tailscale and execute deployment
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navigate to your project directory on the Pi
            cd ~/projects/3d-shop

            # 2. Pull the latest tested code from GitHub
            git pull origin main

            # 3. Build ARM64 Docker images natively on the Pi and start the containers
            docker-compose up -d --build

            # 4. Clean up old, unused Docker images to save storage space
            docker image prune -f
